name: Build APK (speeder)

on:
  push:
    branches: [speeder]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: feeder-speeder-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          retention-days: 30
