name: Build APK (speeder)

on:
  push:
    branches: [speeder]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleFdroidDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feeder-speeder-debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          retention-days: 30

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: >
          ./gradlew assembleFdroidRelease --no-daemon --stacktrace
          -PSTORE_FILE=../shareddebug.keystore
          -PSTORE_PASSWORD=android
          -PKEY_ALIAS=AndroidDebugKey
          -PKEY_PASSWORD=android

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: feeder-speeder-release
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          retention-days: 30
